<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>게시판</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/footer-nav.css">
  <style>
    @font-face {
      font-family: 'CookieRun-Regular';
      src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/CookieRun-Regular.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    body {
      font-family: 'CookieRun-Regular', sans-serif;
      background: #e6dcd0;
      margin: 0;
      padding: 0;
    }

    .card-container {
      width: 375px;
      height: 650px;
      background-color: #fffaf6;
      border-radius: 1.5rem;
      display: flex;
      flex-direction: column;
      margin: 2rem auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      border: 2px solid #d6ccc2;
    }

    .card-header {
      padding: 1.25rem 1.5rem 0 1.5rem;
      background-color: transparent;
      font-size: 1.2rem;
      font-weight: bold;
      color: #5e4633;
    }

    .card-body{
      padding: 1rem 1.5rem;
      overflow-y: auto;
    }

    .section-title {
      font-size: 1.2rem;
      color: #7b4b39;
      margin-top: 1rem;
      margin-bottom: 0.5rem;
    }

    .post-title {
      flex: 1;
      /* 남는 공간 차지 */
      min-width: 0;
      /* 말줄임 처리를 위해 */
      display: block;
      /* flex item이라 같은 줄 유지 */
      color: #3e2f20;
      text-decoration: none;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .book-carousel-wrapper {
      overflow-x: auto;
      padding-bottom: 8px;
    }

    .book-carousel-wrapper::-webkit-scrollbar {
      height: 6px;
    }

    .book-carousel-wrapper::-webkit-scrollbar-thumb {
      background-color: #c8b8a7;
      border-radius: 4px;
    }

    .book-carousel {
      display: flex;
      gap: 12px;
    }

    .book-card {
      flex: 0 0 auto;
      width: 120px;
      background: #fffaf6;
      border: 1px solid #e0d6cc;
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .notice-list {
      background-color: #fff;
      border-radius: 0.75rem;
      padding: 0.5rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }

    .notice-item {
      font-size: 0.95rem;
      color: #3e2f20;
      margin-bottom: 0.1rem;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .fa-thumbs-up {
      color: #e63946;
      margin-right: 4px;
      font-size: 0.9rem;
    }

    .popular-list {
      background-color: #fce2e2;
      border-radius: 0.75rem;
      padding: 0.5rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>

<body>
<section class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
  <div class="card-container">
    <div class="card-header">
      📌 게시판
    </div>
    <div class="card-body">

      <div class="popular-list">🔥인기글</div>
      <div class="popular-list">
        <div class="notice-item">1. 테스트용 메세지 입니다 1
          <span class="likes">
              <i class="fa-solid fa-thumbs-up"></i> <span class="like-count">24</span>
            </span>
        </div>
        <div class="notice-item">2. 테스트용 메세지 입니다 2
          <span class="likes">
              <i class="fa-solid fa-thumbs-up"></i> <span class="like-count">24</span>
            </span>
        </div>
        <div class="notice-item">3. 테스트용 메세지 입니다 3
          <span class="likes">
              <i class="fa-solid fa-thumbs-up"></i> <span class="like-count">24</span>
            </span>
        </div>
      </div>


      <!-- 자유게시판 제목 클릭 시 /bulletin/free-board 로 이동 -->
      <a th:href="@{/bulletin/free-board/list}" class="section-title">자유게시판</a>
      <div class="notice-list">
        <!-- 리스트 반복 -->
        <div th:each="post : ${freeBoardPostList}" class="notice-item">
          <a class="notice-item" th:href="@{/bulletin/free-board/{id}(id=${post.getFreeBoardPostId()})}" th:text="${post.title}">
            [TEST] 게시글 제목
          </a>
        </div>
      </div>

      <div class="section-title">독후감/에세이 게시판</div>
      <div class="notice-list">
        <div class="notice-item">테스트용 메세지 입니다 1</div>
        <div class="notice-item">테스트용 메세지 입니다 2</div>
        <div class="notice-item">테스트용 메세지 입니다 3</div>
      </div>

      <div class="section-title">독서 포럼</div>
      <div class="notice-list">
        <div class="notice-item">테스트용 메세지 입니다 1</div>
        <div class="notice-item">테스트용 메세지 입니다 2</div>
        <div class="notice-item">테스트용 메세지 입니다 3</div>
      </div>
    </div>
    <div th:replace="fragments/footer-nav :: footer('community')"></div>
  </div>
</section>

<script>

</script>
</body>

</html>
