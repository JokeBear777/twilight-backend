<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <title>게시판</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/footer-nav.css">
  <link rel="stylesheet" href="/css/bulletin.css">

</head>

<body>
<section class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
  <div class="card-container">

    <div class="card-header">
      💬 커뮤니티
    </div>

    <div class="card-body">

      <!-- ✅ 피드/게시판 토글 -->
      <div class="social-toggle">
        <a class="social-tab" th:href="@{/social/feed}">피드</a>
        <a class="social-tab active" th:href="@{/bulletin}">게시판</a>
      </div>

      <!-- ✅ 카테고리 카드 -->
      <div class="category-grid">
        <a class="category-card" th:href="@{/bulletin/free-board/list}">
          <div class="category-icon">
            <i class="fa-solid fa-pen"></i>
          </div>
          <div class="category-title">자유게시판</div>
          <div class="category-desc">
            가볍게 아무 말이나<br>
            오늘의 생각을 공유해요
          </div>
        </a>

        <div class="category-card" style="opacity: 0.7; cursor: not-allowed;">
          <div class="category-icon">
            <i class="fa-solid fa-book-open"></i>
          </div>
          <div class="category-title">독후감 / 에세이</div>
          <div class="category-desc">
            책을 읽고 느낀 점을<br>
            기록해보세요 (준비중)
          </div>
        </div>
      </div>

      <!-- ✅ 인기글 (사진 스타일 / 프로필 없음 / 불 없음) -->
      <div class="popular-title">인기 글</div>

      <div class="popular-list">
        <a class="popular-item" href="#">
          <div class="popular-left">
            <div class="popular-post-title">재밌는 책 추천 무턱드려요</div>
            <div class="popular-time">30분 전</div>
          </div>
          <div class="popular-right">
            <i class="fa-solid fa-heart"></i> 5
          </div>
        </a>

        <a class="popular-item" href="#">
          <div class="popular-left">
            <div class="popular-post-title">독후감 작성할 때의 팁!</div>
            <div class="popular-time">1시간 전</div>
          </div>
          <div class="popular-right">
            <i class="fa-solid fa-heart"></i> 4
          </div>
        </a>

        <a class="popular-item" href="#">
          <div class="popular-left">
            <div class="popular-post-title">오늘의 독서 목표 공유합니다</div>
            <div class="popular-time">2시간 전</div>
          </div>
          <div class="popular-right">
            <i class="fa-solid fa-heart"></i> 7
          </div>
        </a>
      </div>

      <!-- ✅ 최신글 제거: 최신글은 자유게시판 list 페이지에서 -->
    </div>

    <div th:replace="fragments/footer-nav :: footer('community')"></div>
  </div>
</section>

</body>
</html>
