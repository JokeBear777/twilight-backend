<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8"/>
    <title>글쓰기</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        @font-face {
            font-family: 'CookieRun-Regular';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/CookieRun-Regular.woff')
            format('woff');
        }

        body {
            font-family: 'CookieRun-Regular', sans-serif;
            background: #e6dcd0;
            min-height: 100vh;
        }

        .card-main-container {
            width: 375px;
            height: 650px;
            background-color: #fffaf6;
            border-radius: 1.5rem;
            margin: 2rem auto;
            display: flex;
            flex-direction: column;
            border: 2px solid #d6ccc2;
        }

        .card-body-center {
            flex-grow: 1;
            padding: 1rem;
        }
    </style>
</head>

<body>

<section class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card-main-container">

        <div class="card-header">
            <span>글쓰기</span>
        </div>

        <!-- ================= 본문 ================= -->
        <div class="card-body-center">
            <form th:action="@{/bulletin/free-board/write}"
                  method="post"
                  id="writeForm"
                  style="display:flex; flex-direction:column; gap:1rem;">

                <!-- 제목 -->
                <div>
                    <label>제목</label>
                    <input type="text" name="title" class="form-control" required>
                </div>

                <!-- 내용 -->
                <div>
                    <label>내용</label>
                    <textarea id="contentEditor"
                              name="content"
                              rows="6"
                              class="form-control"
                              required></textarea>
                </div>

                <!-- 사진 선택 -->
                <div>
                    <label>사진</label>
                    <input type="file" id="imageFile" accept="image/*" class="form-control">
                </div>

                <!-- 사진 업로드 버튼 -->
                <button type="button"
                        id="uploadImageBtn"
                        class="btn btn-outline-secondary">
                    사진 업로드
                </button>

                <!-- 제출 -->
                <button type="submit"
                        class="btn"
                        style="background:#8b5e34; color:white;">
                    글 등록
                </button>

                <a th:href="@{/bulletin/free-board/list}"
                   class="btn btn-outline-secondary">
                    취소
                </a>

            </form>
        </div>
    </div>
</section>

<!-- ================= JS ================= -->
<script>
    // ✅ [이미지N] -> imageId 매핑 저장
    const imageMap = new Map();
    let imageCount = 0;

    /**
     * ✅ textarea 커서 위치에 텍스트 삽입
     */
    function insertAtCursor(textarea, text) {
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;

        const before = textarea.value.substring(0, start);
        const after = textarea.value.substring(end);

        textarea.value = before + text + after;

        const newPos = start + text.length;
        textarea.selectionStart = textarea.selectionEnd = newPos;
        textarea.focus();
    }

    /**
     * ✅ textarea에 있는 내용을 "서버 저장용 HTML"로 변환
     * 1) 줄바꿈 -> <br>
     * 2) [이미지N] -> <img src="...">
     */
    function buildRealHtmlContent(textareaValue) {
        let html = textareaValue.replaceAll("\n", "<br>");

        for (const [n, imageId] of imageMap.entries()) {
            html = html.replaceAll(
                `[이미지${n}]`,
                `<img src="/api/v1/images/${imageId}" />`
            );
        }

        return html;
    }

    // ================= 이미지 업로드 =================
    document.getElementById("uploadImageBtn").addEventListener("click", async () => {
        const fileInput = document.getElementById("imageFile");
        const file = fileInput.files[0];

        if (!file) {
            alert("이미지를 선택하세요");
            return;
        }

        // 1️⃣ presigned URL 요청
        const formData = new FormData();
        formData.append("fileName", file.name);
        formData.append("contentType", file.type || "application/octet-stream");
        formData.append("contentLength", file.size);

        const urlResponse = await fetch("/api/v1/images/url", {
            method: "POST",
            body: formData,
            credentials: "same-origin"
        });

        if (!urlResponse.ok) {
            alert("URL 발급 실패");
            return;
        }

        const presigned = await urlResponse.json();

        // (mock 환경이므로 실제 PUT 생략)
        console.log("mock upload skipped:", file.name);

        // 2️⃣ upload-complete
        const response = await fetch("/api/v1/images/upload-complete", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            credentials: "same-origin",
            body: JSON.stringify({objectKey: presigned.objectKey})
        });

        if (!response.ok) {
            alert("이미지 업로드 실패");
            return;
        }

        // ✅ 3️⃣ 이미지 번호 증가 + 매핑 저장
        imageCount++;
        imageMap.set(imageCount, presigned.imageId);

        // ✅ 4️⃣ textarea에는 UI용 placeholder 삽입 (커서 위치)
        const textarea = document.getElementById("contentEditor");
        insertAtCursor(textarea, `\n[이미지${imageCount}]\n`);

        // 파일 선택 초기화
        fileInput.value = "";

        alert("이미지 업로드 완료");
    });

    // ================= 폼 제출 시 =================
    document.getElementById("writeForm").addEventListener("submit", () => {
        const textarea = document.getElementById("contentEditor");

        // ✅ textarea 내용을 HTML로 변환해서 서버로 전송
        textarea.value = buildRealHtmlContent(textarea.value);
    });
</script>

</body>
</html>
