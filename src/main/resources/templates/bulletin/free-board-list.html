<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <title>홈화면</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/footer-nav.css">

    <style>
        @font-face {
            font-family: 'CookieRun-Regular';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/CookieRun-Regular.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'CookieRun-Regular', sans-serif;
            background: #e6dcd0;
            min-height: 100vh;
            margin: 0;
        }

        .card-main-container {
            width: 375px;
            height: 650px;
            background-color: #fffaf6;
            border-radius: 1.5rem;
            display: flex;
            flex-direction: column;
            margin: 2rem auto;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            border: 2px solid #d6ccc2;
            overflow: hidden; /* ✅ 중요: 내부 scroll-area가 제대로 스크롤되게 */
        }

        .card-header {
            padding: 1.25rem 1.5rem 0.2rem 1.5rem;
            background-color: transparent;
            font-size: 1.2rem;
            font-weight: bold;
            color: #5e4633;
            flex: 0 0 auto;
        }

        .card-body-center {
            flex: 1 1 auto;
            display: flex;
            flex-direction: column;
            align-items: stretch;
            padding: 0;
            min-height: 0; /* ✅ 중요 */
        }

        .scroll-area {
            flex: 1 1 auto;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-bottom: .5rem;
            min-height: 0; /* ✅ 중요 */
        }

        .free-board-post-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .notice-item {
            position: relative;
            display: flex;
            flex-direction: column;
            padding: 0.8rem 1rem;
            background: #fffaf6;
        }

        .notice-item::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: 0;
            width: 100%;
            border-bottom: 1px solid rgba(0, 0, 0, 0.15);
            pointer-events: none;
            z-index: 1;
        }

        .notice-item:last-child::after {
            border-bottom: none;
        }

        .post-top {
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .comment-count {
            font-weight: bold;
            color: #8b5e34;
        }

        .post-title {
            flex: 1;
            min-width: 0;
            display: block;
            color: #3e2f20;
            text-decoration: none;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .post-title:hover {
            text-decoration: underline;
        }

        .post-bottom {
            font-size: 0.8rem;
            color: #8a7a6a;
            margin-left: 1.6rem;
        }

        .separator {
            margin: 0 0.3rem;
            color: #c2b6a3;
        }

        .empty-message {
            text-align: center;
            color: #777;
            margin: 2rem 0;
        }

        .loading-hint {
            text-align: center;
            color: #9a8f83;
            font-size: 0.85rem;
            padding: 0.75rem 0;
        }
    </style>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const postList = document.getElementById("post-list");
            const scrollRoot = document.querySelector(".scroll-area");
            const loadingHint = document.getElementById("loading-hint");

            if (!postList || !scrollRoot) {
                console.error("[init] element missing", { postList, scrollRoot });
                return;
            }

            let isLoading = false;
            let hasNext = true;
            let lastId = null;
            let lastCreatedAt = null;
            let emptyMessage = null;

            // ✅ 스크롤 바닥에서 몇 px 남았을 때 로딩할지
            const BOTTOM_GAP = 200;

            async function loadMorePosts() {
                if (isLoading || !hasNext) return;
                isLoading = true;
                if (loadingHint) loadingHint.style.display = "block";

                let url = `/api/v1/bulletin/free-board?pageSize=10`;
                if (lastId !== null && lastCreatedAt !== null) {
                    url += `&lastId=${lastId}`;
                    url += `&lastCreatedAt=${encodeURIComponent(lastCreatedAt)}`;
                }

                console.log("[fetch]", url);

                try {
                    const res = await fetch(url, { headers: { "Accept": "application/json" } });
                    if (!res.ok) throw new Error("요청 실패: " + res.status);

                    const result = await res.json();
                    const data = Array.isArray(result.data) ? result.data : [];

                    // ✅ 첫 페이지 + 데이터 없음
                    if (data.length === 0 && lastId === null && !emptyMessage) {
                        emptyMessage = document.createElement("p");
                        emptyMessage.className = "empty-message";
                        emptyMessage.textContent = "게시글이 없습니다.";
                        postList.appendChild(emptyMessage);

                        hasNext = false;
                        return;
                    }

                    data.forEach(post => postList.appendChild(createPostElement(post)));

                    hasNext = result.hasNext === true;
                    lastId = result.nextCursor ? result.nextCursor.lastId : null;
                    lastCreatedAt = result.nextCursor?.lastCreatedAt ?? null;

                    console.log("[cursor]", { hasNext, lastId, lastCreatedAt, loaded: data.length });

                } catch (e) {
                    console.error(e);
                    hasNext = false; // 에러면 무한 재시도 방지
                } finally {
                    isLoading = false;
                    if (loadingHint) loadingHint.style.display = "none";

                    // ✅ 핵심: "스크롤이 아직도 바닥 근처면" 다음 페이지를 계속 당겨서 화면 채움
                    // (게시글이 적어서 스크롤이 안 생길 때도 자동으로 여러 페이지 로딩됨)
                    if (hasNext && isNearBottom()) {
                        setTimeout(loadMorePosts, 0);
                    }
                }
            }

            function isNearBottom() {
                const { scrollTop, clientHeight, scrollHeight } = scrollRoot;
                return scrollTop + clientHeight >= scrollHeight - BOTTOM_GAP;
            }

            // ✅ 스크롤 이벤트 방식 (가장 안정적)
            scrollRoot.addEventListener("scroll", () => {
                if (hasNext && !isLoading && isNearBottom()) {
                    loadMorePosts();
                }
            }, { passive: true });

            function createPostElement(post) {
                const item = document.createElement("div");
                item.className = "notice-item";
                item.innerHTML = `
                    <div class="post-top">
                        <span class="comment-count">${post.numberOfComments ?? 0}</span>
                        <a class="post-title" href="/bulletin/free-board/${post.freeBoardPostId}">
                            ${escapeHtml(post.title ?? "")}
                        </a>
                    </div>
                    <div class="post-bottom">
                        <span>${formatDate(post.createdAt)}</span>
                        <span class="separator">|</span>
                        <span>${escapeHtml(post.name ?? "")}</span>
                        <span class="separator">|</span>
                        <span>조회 ${post.views ?? 0}</span>
                        <span class="separator">|</span>
                        <span>추천 ${post.numberOfRecommendations ?? 0}</span>
                    </div>
                `;
                return item;
            }

            function formatDate(isoString) {
                if (!isoString) return "";
                const date = new Date(isoString);
                if (isNaN(date.getTime())) return String(isoString);
                return date.toLocaleString("ko-KR", {
                    year: "numeric", month: "2-digit", day: "2-digit",
                    hour: "2-digit", minute: "2-digit"
                });
            }

            function escapeHtml(str) {
                return String(str)
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#039;");
            }

            // ✅ 초기 로딩 + 화면이 꽉 찰 때까지 자동으로 더 로딩
            loadMorePosts();
        });
    </script>
</head>

<body>
<section class="d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="card-main-container">

        <div class="card-header d-flex align-items-center">
            <div class="d-flex align-items-center">
                <button class="btn btn-link p-0 mr-2"
                        style="color:#5e4633;font-size:1.2rem;"
                        onclick="history.back()">
                    <i class="fas fa-arrow-left"></i>
                </button>

                <span style="font-weight:bold; color:#5e4633;">자유게시판</span>
            </div>

            <div class="ml-auto d-flex">
                <button class="btn btn-sm btn-outline-secondary d-flex align-items-center mr-2"
                        style="padding: 0.25rem 0.6rem; font-size: 0.8rem;"
                        onclick="location.href='/bulletin/free-board/search'">
                    <i class="fas fa-search mr-1"></i>검색
                </button>

                <button class="btn btn-sm btn-outline-secondary d-flex align-items-center"
                        style="padding: 0.25rem 0.6rem; font-size: 0.8rem;"
                        onclick="location.href='/bulletin/free-board/write'">
                    <i class="fas fa-pen mr-1"></i>글쓰기
                </button>
            </div>
        </div>

        <div class="card-body-center">
            <div class="scroll-area">
                <div class="free-board-post-list" id="post-list"></div>
                <div id="loading-hint" class="loading-hint" style="display:none;">불러오는 중…</div>
            </div>
        </div>

        <div th:replace="fragments/footer-nav :: footer('community')"></div>
    </div>
</section>
</body>

</html>
