<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>책 추천</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/footer-nav.css">
    <style>
        @font-face {
            font-family: 'CookieRun-Regular';
            src: url('https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/CookieRun-Regular.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        body {
            font-family: 'CookieRun-Regular', sans-serif;
            background: #e6dcd0;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            border-radius: 1.5rem;
            width: 375px;
            height: 650px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            background-color: #fffaf6;
        }

        .card-body {
            overflow-y: auto;
            color: #4e3b31;
            font-size: 1.1rem;
        }

        h2 {
            font-size: 2rem;
            color: #7b4b39;
            text-align: center;
            margin-bottom: 1.5rem;
        }

        .quote-text {
            font-size: 1.4rem;
            color: #6a4e42;
            text-align: center;
            padding: 1rem 1.5rem;
            border-radius: 1rem;
            background-color: #fdf2e9;
            min-height: 130px;
            margin-bottom: 2rem;
            cursor: pointer;
            user-select: none;
        }

        .spinner-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body class="gradient-custom">
<section class="d-flex justify-content-center align-items-center" style="min-height:100vh;">
    <div class="card d-flex flex-column">
        <div class="card-body p-4 d-flex flex-column justify-content-center align-items-center">
            <h2>책을 고르고 있어요<br>잠시만 기다려주세요</h2>

            <div id="quoteBox" class="quote-text" onclick="nextQuote()">
                "책장을 넘길 때마다, 마음의 온도가 조금씩 올라갑니다."
            </div>

            <div class="spinner-wrapper">
                <div class="spinner-border text-secondary" role="status" style="width: 5rem; height: 5rem;"></div>
            </div>
        </div>
        <div th:replace="fragments/footer-nav :: footer('recommend')"></div>
    </div>
</section>

<script>
    const quotes = [
        "책장을 넘길 때마다, 마음의 온도가 조금씩 올라갑니다.",
        "오늘의 문장은, 내일의 나를 만듭니다.",
        "고요한 문장 속에서 나를 만나요.",
        "마음이 복잡할수록, 책은 단순하게 위로해줍니다.",
        "읽는다는 건, 나를 들여다보는 또 하나의 방법이죠."
    ];

    let quoteIndex = 0;
    function nextQuote() {
        quoteIndex = (quoteIndex + 1) % quotes.length;
        document.getElementById("quoteBox").innerText = '"' + quotes[quoteIndex] + '"';
    }

    const intervalId = setInterval(() => {
        fetch('/book/api/recommendation/complete'   ,{credentials: 'include'})
            .then(response => {
                if (response.status === 200) {
                    window.location.href = '/book/recommendation/complete';
                    clearInterval(intervalId);
                }
            })
            .catch(err => console.error('Polling error:', err));
    }, 2000);
</script>
</body>

</html>
