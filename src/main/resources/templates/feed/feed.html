<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>피드</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/css/footer-nav.css">
    <link rel="stylesheet" href="/css/bulletin.css">

    <style>
        .feed-item {
            border-bottom: 1px solid #eee;
            padding: 16px 0;
        }

        .feed-author {
            font-weight: 600;
        }

        .feed-time {
            font-size: 12px;
            color: #888;
        }

        .feed-content {
            margin-top: 8px;
        }

        .loader {
            text-align: center;
            padding: 20px;
            color: #999;
        }

        .feed-item:hover {
            background-color: #f9f9f9;
            cursor: pointer;
        }
    </style>
</head>

<body>
<section class="d-flex justify-content-center align-items-center"
         style="min-height: 100vh;">
    <div class="card-container">

        <div class="card-header">
            커뮤니티
        </div>

        <div class="card-body">

            <!-- 피드/게시판 토글 -->
            <div class="social-toggle">
                <a class="social-tab active"
                   th:href="@{/social/feed}">피드</a>
                <a class="social-tab"
                   th:href="@{/bulletin}">게시판</a>
            </div>

            <!-- 피드 리스트 -->
            <div id="feed-container"></div>

            <!-- 로딩 영역 -->
            <div id="feed-loader" class="loader">
                불러오는 중...
            </div>

        </div>

        <div th:replace="fragments/footer-nav :: footer('community')"></div>
    </div>
</section>

<script>
    let lastFeedEventId = null;
    let lastCreatedAt = null;
    let isLoading = false;
    const pageSize = 10;

    const container = document.getElementById("feed-container");
    const loader = document.getElementById("feed-loader");

    async function loadFeed() {
        if (isLoading) return;

        isLoading = true;
        loader.style.display = "block";

        try {
            let url = `/api/v1/feed?pageSize=${pageSize}`;

            if (lastFeedEventId && lastCreatedAt) {
                url += `&lastFeedEventId=${lastFeedEventId}`;
                url += `&lastCreatedAt=${encodeURIComponent(lastCreatedAt)}`;
            }

            const response = await fetch(url);

            if (!response.ok) {
                throw new Error("API 요청 실패");
            }

            const result = await response.json();

            // 🔥 여기 핵심 수정
            if (result.data && result.data.length > 0) {
                renderFeed(result.data);
            }

            if (result.nextCursor) {
                lastFeedEventId = result.nextCursor.lastFeedEventId;
                lastCreatedAt = result.nextCursor.lastCreatedAt;
            }

            if (!result.hasNext) {
                loader.innerText = "더 이상 피드가 없습니다.";
                window.removeEventListener("scroll", handleScroll);
            } else {
                loader.style.display = "none";
            }

        } catch (error) {
            console.error("피드 로딩 실패:", error);
            loader.innerText = "피드를 불러오지 못했습니다.";
        }

        isLoading = false;
    }

    function renderFeed(items) {
        items.forEach(item => {
            const div = document.createElement("div");
            div.className = "feed-item";

            div.innerHTML = `
            <div class="feed-author">${item.authorName}</div>
            <div class="feed-time">${formatDate(item.createdAt)}</div>
            <div class="feed-content">${item.content}</div>
        `;

            // 클릭 시 상세페이지 이동
            div.style.cursor = "pointer";

            div.addEventListener("click", () => {
                if (item.eventType === "FREE_BOARD_POST_CREATED") {
                    window.location.href = `/bulletin/free-board/${item.postId}`;
                }
            });

            container.appendChild(div);
        });
    }


    function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleString();
    }

    function handleScroll() {
        if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 100) {
            loadFeed();
        }
    }

    // 무한스크롤 이벤트 등록
    window.addEventListener("scroll", handleScroll);

    // 최초 로딩
    loadFeed();
</script>

</body>
</html>
